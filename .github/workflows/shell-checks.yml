name: Shell checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: POSIX shell syntax
        run: |
          dash -n install.sh
          dash -n uninstall.sh
          dash -n files/tailscale-ap-mode
          dash -n files/tailscale-ap-mode.init

      - name: ShellCheck
        run: |
          shellcheck -s sh install.sh uninstall.sh files/tailscale-ap-mode
          # START/STOP are consumed by OpenWrt /etc/rc.common, so ShellCheck
          # cannot see their external use. SC2096 is also expected for rc.common.
          shellcheck -s sh -e SC2034,SC2096 files/tailscale-ap-mode.init
